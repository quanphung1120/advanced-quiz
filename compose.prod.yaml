services:
  db:
    image: postgres:18.3
    container_name: advanced-quiz-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: advanced_quiz
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_secure_password_here}
    volumes:
      - postgres-data-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d advanced_quiz"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api-new/Dockerfile
    container_name: advanced-quiz-api-prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-your_secure_password_here}@db:5432/advanced_quiz
      AUTH_SECRET: ${AUTH_SECRET:-your_32_character_minimum_secret}
      API_URL: ${API_URL:-https://api.yourdomain.com}
      WEB_URL: ${WEB_URL:-https://yourdomain.com}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://yourdomain.com}
    ports:
      - "3001:3001"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3001/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web-new/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.yourdomain.com}
    container_name: advanced-quiz-web-prod
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  postgres-data-prod:
