name: Deploy to Dokploy

on:
  push:
    branches:
      - main
    paths:
      - "apps/api-new/**"
      - "apps/web-new/**"
      - "packages/config/**"
      - "packages/contracts/**"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: dokploy-deploy-main
  cancel-in-progress: true

env:
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/advanced-quiz-api:latest
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/advanced-quiz-web:latest

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api-new/Dockerfile
          push: true
          tags: ${{ env.API_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web-new/Dockerfile
          push: true
          tags: ${{ env.WEB_IMAGE }}
          build-args: |
            VITE_API_URL=${{ vars.PROD_VITE_API_URL }}
            VITE_CLOUDINARY_CLOUD_NAME=${{ vars.PROD_VITE_CLOUDINARY_CLOUD_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger API deploy
        run: |
          curl --fail --show-error --silent \
            -X POST "${{ secrets.DOKPLOY_URL }}/api/application.deploy" \
            -H "accept: application/json" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${{ secrets.DOKPLOY_TOKEN }}" \
            -d '{"applicationId":"${{ secrets.DOKPLOY_API_APP_ID }}"}'

      - name: Trigger web deploy
        run: |
          curl --fail --show-error --silent \
            -X POST "${{ secrets.DOKPLOY_URL }}/api/application.deploy" \
            -H "accept: application/json" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${{ secrets.DOKPLOY_TOKEN }}" \
            -d '{"applicationId":"${{ secrets.DOKPLOY_WEB_APP_ID }}"}'
